name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${REF_NAME}"
          if [[ "${REF_TYPE}" != "tag" ]]; then
            echo "ERROR: release ref must be a tag, got '${REF_TYPE}'" >&2
            exit 1
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: release ref must be a vX.Y.Z tag, got '${TAG}'" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test -v -race -count=1 ./...

      - name: Build (arm64)
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          GOARCH=arm64 GOOS=darwin go build -ldflags="-s -w -X github.com/s4na/ldcron/cmd.version=${VERSION_TAG}" \
            -o ldcron-darwin-arm64 .
          tar czf ldcron-darwin-arm64.tar.gz ldcron-darwin-arm64
          shasum -a 256 ldcron-darwin-arm64.tar.gz > ldcron-darwin-arm64.tar.gz.sha256

      - name: Build (amd64)
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          GOARCH=amd64 GOOS=darwin go build -ldflags="-s -w -X github.com/s4na/ldcron/cmd.version=${VERSION_TAG}" \
            -o ldcron-darwin-amd64 .
          tar czf ldcron-darwin-amd64.tar.gz ldcron-darwin-amd64
          shasum -a 256 ldcron-darwin-amd64.tar.gz > ldcron-darwin-amd64.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            ldcron-darwin-arm64.tar.gz
            ldcron-darwin-arm64.tar.gz.sha256
            ldcron-darwin-amd64.tar.gz
            ldcron-darwin-amd64.tar.gz.sha256
          generate_release_notes: true

      - name: Update Homebrew formula
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          ARM64_SHA256=$(awk '{print $1}' ldcron-darwin-arm64.tar.gz.sha256)
          AMD64_SHA256=$(awk '{print $1}' ldcron-darwin-amd64.tar.gz.sha256)
          TAG="${VERSION_TAG}"
          VERSION="${TAG#v}"

          if [[ -z "${ARM64_SHA256}" || -z "${AMD64_SHA256}" ]]; then
            echo "ERROR: SHA256 values are empty" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # タグ checkout によるデタッチド HEAD から main ブランチへ切り替える
          git fetch origin main
          git switch main

          # トップレベルの on_arm do / on_intel do ブロック（2スペースインデント）のみを対象とする
          # def install 内のネストされたブロック（4スペースインデント）は変更しない
          sed -i '' "s/  version \"[^\"]*\"/  version \"${VERSION}\"/" Formula/ldcron.rb
          sed -i '' "/^  on_arm do/,/^  end/{s/sha256 \"[^\"]*\"/sha256 \"${ARM64_SHA256}\"/;}" Formula/ldcron.rb
          sed -i '' "/^  on_intel do/,/^  end/{s/sha256 \"[^\"]*\"/sha256 \"${AMD64_SHA256}\"/;}" Formula/ldcron.rb

          git add Formula/ldcron.rb
          # [skip ci] により auto-release.yml の二重発火を防ぐ
          # （actor チェックでも防止されるが明示的に付与する）
          git commit -m "chore: update Homebrew formula to ${TAG} [skip ci]"
          # auto-release.yml の patch バンプと競合する可能性があるため、
          # pull --rebase して push し、失敗した場合は最大3回リトライする
          PUSHED=false
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              PUSHED=true
              break
            fi
            echo "Push failed (attempt ${i}/3), retrying in 5s..."
            sleep 5
          done
          if [[ "${PUSHED}" != "true" ]]; then
            echo "ERROR: Failed to push after 3 attempts" >&2
            exit 1
          fi
