name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify before release
    runs-on: macos-latest
    # 41898282 is github-actions[bot].
    if: github.actor_id != '41898282'
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Build release binary (arm64)
        run: GOARCH=arm64 GOOS=darwin go build -ldflags="-s -w" -o ldcron-darwin-arm64 .

      - name: Build release binary (amd64)
        run: GOARCH=amd64 GOOS=darwin go build -ldflags="-s -w" -o ldcron-darwin-amd64 .

  auto-release:
    name: Bump version and release
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: bump
        run: |
          CURRENT=$(grep 'var version' cmd/root.go | sed 's/.*"\(.*\)".*/\1/')
          IFS='.' read -r major minor patch <<< "$CURRENT"
          NEW="${major}.${minor}.$((patch + 1))"
          sed -i "s/var version = \"${CURRENT}\"/var version = \"${NEW}\"/" cmd/root.go
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add cmd/root.go
          git commit -m "chore: bump version to v${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push origin main
          git push origin "v${VERSION}"
          gh workflow run release.yml --ref "v${VERSION}"
